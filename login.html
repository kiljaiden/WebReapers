<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Eternal Reapers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        :root { --bnet-bg:#15171e; --bnet-panel:#1e2028; --bnet-border:#2a2e38; --bnet-text:#d2d6df;
                --bnet-text-muted:#858b99; --wow-gold:#f8b700; --wow-gold-dim:#d49b00; --danger:#b30000; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Open Sans',sans-serif; }
        body { background: var(--bnet-bg); color: var(--bnet-text); display:flex; justify-content:center; align-items:center;
               min-height:100vh; padding:20px; background-image: radial-gradient(circle at 50% 30%, #1e222d 0%, #0b0c10 100%); }
        .auth-container { background: var(--bnet-panel); padding:40px; border-radius:8px; border:1px solid var(--bnet-border);
            width:100%; max-width:420px; box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 30px rgba(248,183,0,.06); animation: erFadeUp .5s ease both; }
        .logo-text { color: var(--wow-gold); text-align:center; font-size:1.9rem; text-transform:uppercase; letter-spacing:3px;
            margin-bottom:6px; text-shadow: 0 0 20px rgba(248,183,0,.4); }
        .logo-sub { text-align:center; color:var(--bnet-text-muted); font-size:.75rem; text-transform:uppercase; letter-spacing:2px; margin-bottom:26px; }
        h2 { color:#fff; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; margin-bottom:8px; color:var(--bnet-text-muted); font-size:.8rem; text-transform:uppercase; font-weight:600; }
        input { width:100%; background:#101216; color:var(--bnet-text); border:1px solid var(--bnet-border);
            padding:12px; border-radius:6px; outline:none; transition:.25s; }
        input:focus { border-color: var(--wow-gold); box-shadow: 0 0 10px rgba(248,183,0,.25); }
        .btn-primary { width:100%; background: linear-gradient(180deg, var(--wow-gold), var(--wow-gold-dim)); color:#000;
            font-weight:700; border:none; padding:13px; border-radius:6px; cursor:pointer; transition:.25s; margin-top:10px;
            font-size:1rem; text-transform:uppercase; letter-spacing:1px; }
        .btn-primary:hover { filter:brightness(1.12); box-shadow:0 0 16px rgba(248,183,0,.45); transform:translateY(-1px); }
        .btn-google { width:100%; background:#fff; color:#3c4043; font-weight:600; border:none; padding:12px; border-radius:6px;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; font-size:.95rem; transition:.25s; }
        .btn-google:hover { box-shadow:0 4px 14px rgba(0,0,0,.4); transform:translateY(-1px); }
        .divider { display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--bnet-text-muted); font-size:.75rem; text-transform:uppercase; letter-spacing:1px; }
        .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--bnet-border); }
        .toggle-form { text-align:center; margin-top:20px; color:var(--bnet-text-muted); cursor:pointer; font-size:.9rem; transition:.25s; }
        .toggle-form:hover { color: var(--wow-gold); }
        #register-form { display:none; }
        .error-msg { color:#ff6b6b; text-align:center; margin-top:15px; font-size:.9rem; min-height:1.2em; }
        .back-home { display:block; text-align:center; margin-top:18px; color:var(--bnet-text-muted); text-decoration:none; font-size:.8rem; }
        .back-home:hover { color:#fff; }
    </style>
    <!-- ===== Configuracion unica de la Base de Datos en linea (Firebase) ===== -->
    <script src="firebase-config.js"></script>
    <script src="firebase-init.js"></script>
    <link rel="stylesheet" href="shared-design.css">
    <!-- ===== PWA: manifest, tema y service worker ===== -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#15171e">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
    window.addEventListener('offline',()=>document.body.classList.add('er-offline'));
    window.addEventListener('online',()=>document.body.classList.remove('er-offline'));</script>
</head>
<body>
<div id="er-offline-banner">⚠️ Sin conexión — mostrando datos en caché (modo offline PWA)</div>

    <div class="auth-container">
        <h1 class="logo-text"><i class="fas fa-skull-crossbones" style="font-size:1.4rem"></i> Eternal Reapers</h1>
        <p class="logo-sub">Portal de Hermandad · WotLK 3.3.5a</p>

        <!-- Formulario de Login -->
        <div id="login-form">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem; text-align: center;">Iniciar Sesión</h2>
            <button class="btn-google" id="btn-google-login" type="button">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.02-4.86 6.61l7.53 5.85c4.51-4.18 7.37-10.36 7.37-16.93z"/><path fill="#FBBC05" d="M10.53 28.84c-.48-1.45-.76-2.99-.76-4.84s.28-3.39.76-4.84l-7.97-6.19C.91 16.46 0 20.12 0 24c0 3.88.91 7.54 2.56 10.78l7.97-5.94z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.53-5.85c-2.18 1.45-5.1 2.37-8.36 2.37-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Continuar con Google
            </button>
            <div class="divider">o con tu correo</div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="login-email" placeholder="correo@ejemplo.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn-primary" id="btn-login"><i class="fas fa-sign-in-alt"></i> Entrar al Panel</button>
            <p class="toggle-form" id="show-register">¿No eres miembro? Solicita acceso aquí.</p>
        </div>

        <!-- Formulario de Registro -->
        <div id="register-form">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem; text-align: center;">Registro de Miembro</h2>
            <button class="btn-google" id="btn-google-register" type="button">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.02-4.86 6.61l7.53 5.85c4.51-4.18 7.37-10.36 7.37-16.93z"/><path fill="#FBBC05" d="M10.53 28.84c-.48-1.45-.76-2.99-.76-4.84s.28-3.39.76-4.84l-7.97-6.19C.91 16.46 0 20.12 0 24c0 3.88.91 7.54 2.56 10.78l7.97-5.94z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.53-5.85c-2.18 1.45-5.1 2.37-8.36 2.37-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Registrarse con Google
            </button>
            <div class="divider">o crea una cuenta</div>
            <div class="form-group">
                <label>Nombre de tu Personaje Principal (Main)</label>
                <input type="text" id="reg-main" placeholder="Ej: Jaiden" maxlength="26">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="reg-email" placeholder="correo@ejemplo.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Contraseña (Mínimo 6 caracteres)</label>
                <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button class="btn-primary" id="btn-register"><i class="fas fa-user-plus"></i> Registrarse</button>
            <p class="toggle-form" id="show-login">¿Ya tienes cuenta? Inicia sesión.</p>
        </div>

        <div id="auth-error" class="error-msg"></div>
        <a class="back-home" href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </div>

    <script src="shared-auth.js" defer></script>
    <script type="module">
        import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
                 GoogleAuthProvider, signInWithPopup } from 'firebase/auth';
        // Esperar a que firebase-init.js complete la conexion con la BD en linea
        const { erDbReady } = await import('./firebase-init.js');
        const { auth, db } = await erDbReady();
        while (!window.erEnsureUserDoc) await new Promise(r => setTimeout(r, 50));

        const errEl = document.getElementById('auth-error');
        function showErr(msg) { errEl.innerText = msg; if (window.erToast) erToast(msg, 'error'); }

        // UI Toggles
        document.getElementById('show-register').addEventListener('click', () => {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            errEl.innerText = '';
        });
        document.getElementById('show-login').addEventListener('click', () => {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            errEl.innerText = '';
        });

        // Comprobar si ya está logueado
        onAuthStateChanged(auth, (user) => {
            if (user) { window.location.href = 'index.html'; }
        });

        // ===== LOGIN con correo =====
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            if (!email || !pass) return showErr('Completa correo y contraseña.');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // entra por el onAuthStateChanged -> index.html
            } catch (error) {
                showErr(window.erAuthError(error.code));
            }
        });

        // ===== LOGIN / REGISTRO con GOOGLE (popup) =====
        const googleProvider = new GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });
        async function googleAuth() {
            errEl.innerText = '';
            try {
                const cred = await signInWithPopup(auth, googleProvider);
                const u = cred.user;
                // Identidad unica: un solo doc users/{uid}, sin duplicar correos
                const res = await window.erEnsureUserDoc(auth, db, u.uid, {
                    email: u.email,
                    mainName: (u.displayName || '').split(' ')[0] || u.email.split('@')[0],
                    role: 'Iniciado',
                    provider: 'google',
                    avatarUrl: u.photoURL || `https://via.placeholder.com/150/1a1a1a/f8b700?text=${encodeURIComponent((u.email[0] || 'E').toUpperCase())}`
                });
                if (res === 'migrated') console.info('[auth] Cuenta duplicada migrada al uid canonico:', u.uid);
                // onAuthStateChanged redirige a index.html
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') showErr(window.erAuthError(error.code));
            }
        }
        document.getElementById('btn-google-login').addEventListener('click', googleAuth);
        document.getElementById('btn-google-register').addEventListener('click', googleAuth);

        // ===== REGISTRO nuevo con correo =====
        document.getElementById('btn-register').addEventListener('click', async () => {
            const mainName = document.getElementById('reg-main').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;

            if (!mainName || !email || !pass) return showErr('Completa todos los campos.');
            if (pass.length < 6) return showErr('La contraseña debe tener al menos 6 caracteres.');

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;
                // UN solo ID: users/{uid}. erEnsureUserDoc ademas fusiona
                // cualquier registro duplicado viejo del mismo correo.
                await window.erEnsureUserDoc(auth, db, user.uid, {
                    email: email,
                    mainName: mainName,
                    role: 'Iniciado',
                    provider: 'password',
                    avatarUrl: `https://via.placeholder.com/150/1a1a1a/f8b700?text=${encodeURIComponent(mainName.charAt(0).toUpperCase())}`
                });
                // Redirigirá automáticamente por el onAuthStateChanged
            } catch (error) {
                showErr(window.erAuthError(error.code));
            }
        });

        // Enter envia los formularios
        document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });
        document.getElementById('reg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-register').click(); });
    </script>
    <script src="shared-ui.js" defer></script>
</body>
</html>
