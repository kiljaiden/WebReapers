<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Talentos - Eternal Reapers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        const whTooltips = {
            colorLinks: true, 
            iconizeLinks: true, 
            renameLinks: true, 
            domain: 'es.wotlk' // Fuerza la base de datos 3.3.5a en español
        };
    </script>
    <script src="https://wow.zamimg.com/widgets/power.js"></script>

    <style>
        /* ========================================================= */
        /* ESTILOS BATTLE.NET (ARMONÍA VISUAL ETERNAL REAPERS)       */
        /* ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        :root {
            --bnet-bg: #15171e; --bnet-panel: #1e2028; --bnet-sidebar: #101216;
            --bnet-blue: #0074e0; --bnet-blue-hover: #008afb; --bnet-text: #d2d6df;
            --bnet-border: #2a2e38; --wow-gold: #f8b700; --danger: #b30000;
            --success: #00ff00; --epic: #a335ee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--bnet-bg); color: var(--bnet-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        .bnet-topbar { height: 65px; background: #101216; border-bottom: 1px solid #1a1c23; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; flex-shrink: 0; z-index: 100;}
        .top-nav a { color: var(--bnet-text); background-color: var(--bnet-panel); border: 1px solid var(--bnet-border); text-decoration: none; font-size: 0.8rem; font-weight: 700; transition: 0.2s; text-transform: uppercase; padding: 8px 16px; border-radius: 4px; }
        .top-nav a:hover, .top-nav a.active { background-color: var(--wow-gold); color: #000; border-color: var(--wow-gold); }

        .bnet-app-body { display: flex; flex-grow: 1; height: calc(100vh - 145px); }
        .bnet-sidebar { width: 260px; background: var(--bnet-sidebar); border-right: 1px solid #1a1c23; overflow-y: auto; flex-shrink: 0; }
        .sidebar-title { font-size: 0.7rem; color: #555; padding: 15px 25px 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 15px; color: #858b99; cursor: pointer; border-left: 3px solid transparent; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: #fff; border-left: 3px solid var(--wow-gold); }

        .bnet-main { flex-grow: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top, #1e222d 0%, #15171e 100%); }

        /* Calculadora */
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 4px; border-left: 4px solid var(--wow-gold); }
        .points-display { font-size: 2.5rem; font-weight: bold; color: var(--wow-gold); font-family: monospace; text-shadow: 0 0 10px rgba(248, 183, 0, 0.4); }
        
        .trees-container { display: flex; gap: 20px; justify-content: center; min-width: 900px; }
        .tree-panel { flex: 1; max-width: 300px; background: #0b0c10; border: 1px solid #333; border-radius: 4px; position: relative; overflow: hidden; }
        
        .tree-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.4; background-size: cover; z-index: 0; }
        .tree-header { position: relative; z-index: 1; padding: 15px; text-align: center; background: rgba(0,0,0,0.7); border-bottom: 1px solid #333; }
        .tree-title { font-size: 1.1rem; font-weight: bold; color: #fff; text-transform: uppercase; }

        .tree-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(11, 50px); gap: 10px; padding: 20px; justify-items: center; }
        
        /* SPRITESHEET LOGIC */
        .talent-slot { position: relative; width: 44px; height: 44px; cursor: pointer; }
        .talent-icon { 
            width: 100%; height: 100%; border-radius: 4px; border: 2px solid #444; 
            filter: grayscale(100%) brightness(0.5); 
            background-repeat: no-repeat;
            background-size: 440px auto; /* 10 iconos de ancho de 44px */
        }
        
        .talent-slot.available .talent-icon { filter: grayscale(0%) brightness(0.8); border-color: #888; }
        .talent-slot.active .talent-icon { filter: grayscale(0%) brightness(1); border-color: var(--success); }
        .talent-slot.maxed .talent-icon { filter: grayscale(0%) brightness(1); border-color: var(--wow-gold); box-shadow: 0 0 10px var(--wow-gold); }

        .talent-rank { position: absolute; bottom: -6px; right: -6px; background: #111; border: 1px solid #444; color: #888; font-size: 0.7rem; font-weight: bold; padding: 1px 4px; border-radius: 3px; z-index: 3; }
        .talent-slot.active .talent-rank { color: var(--success); border-color: var(--success); }
        .talent-slot.maxed .talent-rank { color: var(--wow-gold); border-color: var(--wow-gold); }

        .calc-footer { display: flex; gap: 15px; margin-top: 30px; justify-content: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <header class="bnet-topbar">
        <div class="bnet-logo">
            <i class="fab fa-battle-net" style="color:#00aeff; font-size:2rem;"></i>
            <nav class="top-nav">
                <a href="index.html">Inicio</a>
                <a href="softreserve.html">SoftReserve</a>
                <a href="dkp.html">DKP</a>
                <a href="talentos.html" class="active">Talentos</a>
            </nav>
        </div>
        <div class="user-menu"><span id="user-name" style="font-weight: bold;">Jaiden</span></div>
    </header>

    <div class="bnet-app-body">
        <aside class="bnet-sidebar" id="class-sidebar">
            <div class="sidebar-title">Clases (WotLK 3.3.5a)</div>
        </aside>

        <main class="bnet-main">
            <div class="calc-header">
                <div>
                    <h2 id="display-class-name">Selecciona Clase</h2>
                    <p style="color: var(--bnet-text-muted); font-size: 0.8rem;">Calculadora Eternal Reapers | Soporte Español</p>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 0.7rem; font-weight: bold; color: #888;">PUNTOS DISPONIBLES</p>
                    <div class="points-display" id="points-remaining">71</div>
                </div>
            </div>
            <div class="trees-container" id="trees-wrapper"></div>
            <div class="calc-footer">
                <button class="btn-primary" style="background: transparent; border: 1px solid #444;" onclick="resetBuild()">Reiniciar</button>
                <button class="btn-primary" onclick="exportBuild()">Copiar Build</button>
            </div>
        </main>
    </div>

    <script>
        // DICCIONARIO PARA TRADUCIR EL JSON (DE INGLÉS A ESPAÑOL)
        const diccionario = {
            "deathknight": "Caballero de la Muerte", "paladin": "Paladín", "warrior": "Guerrero",
            "hunter": "Cazador", "shaman": "Chamán", "druid": "Druida", "rogue": "Pícaro",
            "priest": "Sacerdote", "mage": "Mago", "warlock": "Brujo",
            "Blood": "Sangre", "Frost": "Escarcha", "Unholy": "Profano",
            "Holy": "Sagrado", "Protection": "Protección", "Retribution": "Reprensión",
            "Arms": "Armas", "Fury": "Furia"
        };

        let talentData = null;
        let globalPoints = 71;
        let activeClass = null;
        let buildState = {}; // { treeIdx: [puntos, puntos...] }

        // 1. CARGA DINÁMICA DEL JSON
        async function init() {
            try {
                const response = await fetch('talentos.json');
                talentData = await response.json();
                renderSidebar();
                // Cargamos la primera clase que encontremos
                if (talentData.classes.length > 0) loadClass(talentData.classes[0].id);
            } catch (err) {
                console.error("Error al leer talentos.json:", err);
            }
        }

        // 2. GENERAR MENÚ DE CLASES
        function renderSidebar() {
            const sidebar = document.getElementById('class-sidebar');
            sidebar.innerHTML = '<div class="sidebar-title">Clases (WotLK 3.3.5a)</div>';
            talentData.classes.forEach(cls => {
                const item = document.createElement('div');
                item.className = `nav-item ${activeClass?.id === cls.id ? 'active' : ''}`;
                item.innerHTML = `<img src="icons/${cls.id}.jpg" style="width:24px; height:24px; border-radius:4px;"> <span>${diccionario[cls.id] || cls.name}</span>`;
                item.onclick = () => loadClass(cls.id);
                sidebar.appendChild(item);
            });
        }

        // 3. CAMBIAR DE CLASE
        function loadClass(classId) {
            activeClass = talentData.classes.find(c => c.id === classId);
            document.getElementById('display-class-name').innerText = diccionario[classId] || activeClass.name;
            globalPoints = 71; 
            buildState = {};
            renderTrees(); renderSidebar(); updateGlobalDisplay();
        }

        // 4. RENDERIZAR ÁRBOLES
        function renderTrees() {
            const wrapper = document.getElementById('trees-wrapper');
            wrapper.innerHTML = '';

            activeClass.trees.forEach((tree, treeIdx) => {
                buildState[treeIdx] = Array(tree.talents.length).fill(0);
                const panel = document.createElement('div');
                panel.className = 'tree-panel';
                panel.innerHTML = `
                    <div class="tree-bg" style="background-image: url('img/${tree.background}')"></div>
                    <div class="tree-header">
                        <div class="tree-title">${diccionario[tree.name] || tree.name}</div>
                        <div class="tree-pts-count" id="tree-pts-${treeIdx}">0</div>
                    </div>
                    <div class="tree-grid" id="grid-${treeIdx}"></div>
                `;

                const grid = panel.querySelector('.tree-grid');
                for(let i=0; i<44; i++) {
                    const r = Math.floor(i / 4); const c = i % 4;
                    const tIdx = tree.talents.findIndex(t => t.row === r && t.col === c);
                    
                    if(tIdx !== -1) {
                        const talent = tree.talents[tIdx];
                        const slot = document.createElement('div');
                        slot.className = 'talent-slot disabled';
                        slot.id = `talent-${treeIdx}-${tIdx}`;
                        
                        // CÁLCULO DE POSICIÓN EN SPRITESHEET
                        const iconX = (talent.icon % 10) * 44;
                        const iconY = Math.floor(talent.icon / 10) * 44;

                        slot.innerHTML = `
                            <div class="talent-icon" style="background-image: url('img/${tree.spriteSheet}'); background-position: -${iconX}px -${iconY}px;"></div>
                            <div class="talent-rank">0/${talent.maxRank}</div>
                        `;
                        
                        // VÍNCULO CON WOWHEAD (Búsqueda por nombre en español)
                        slot.setAttribute('data-wowhead', `spell&name=${talent.name.replace(/ /g, '+')}&domain=es.wotlk`);
                        
                        slot.onmousedown = (e) => handleInteraction(e, treeIdx, tIdx);
                        grid.appendChild(slot);
                    } else {
                        grid.appendChild(document.createElement('div'));
                    }
                }
                wrapper.appendChild(panel);
            });
            refreshUI();
        }

        // 5. SUMAR / RESTAR PUNTOS
        function handleInteraction(e, treeIdx, tIdx) {
            const isLeft = e.button === 0; const isRight = e.button === 2;
            const talent = activeClass.trees[treeIdx].talents[tIdx];
            const current = buildState[treeIdx][tIdx];

            if(isLeft) {
                if(globalPoints <= 0 || current >= talent.maxRank) return;
                const totalTree = buildState[treeIdx].reduce((a, b) => a + b, 0);
                if(totalTree < talent.row * 5) return; // Requisito de fila
                
                // Validación Attached (Pre-requisito)
                if(talent.attached !== "none") {
                    const pIdx = activeClass.trees[treeIdx].talents.findIndex(t => t.name === talent.attached);
                    if(buildState[treeIdx][pIdx] < activeClass.trees[treeIdx].talents[pIdx].maxRank) return;
                }
                buildState[treeIdx][tIdx]++; globalPoints--;
            } 
            else if(isRight) {
                if(current <= 0) return;
                const totalTree = buildState[treeIdx].reduce((a, b) => a + b, 0);
                let canRemove = true;
                
                activeClass.trees[treeIdx].talents.forEach((t, idx) => {
                    // No quitar si bloquea filas inferiores
                    if(buildState[treeIdx][idx] > 0 && t.row > talent.row) {
                        if(totalTree - 1 < t.row * 5) canRemove = false;
                    }
                    // No quitar si es pre-requisito de otro talento con puntos
                    if(t.attached === talent.name && buildState[treeIdx][idx] > 0) {
                        if(current - 1 < talent.maxRank) canRemove = false;
                    }
                });
                if(!canRemove) return;
                buildState[treeIdx][tIdx]--; globalPoints++;
            }
            refreshUI();
        }

        // 6. REFRESCAR TODO (WOWHEAD REFRESH INCLUIDO)
        function refreshUI() {
            document.getElementById('points-remaining').innerText = globalPoints;
            activeClass.trees.forEach((tree, treeIdx) => {
                const totalTree = buildState[treeIdx].reduce((a, b) => a + b, 0);
                document.getElementById(`tree-pts-${treeIdx}`).innerText = totalTree;
                tree.talents.forEach((talent, tIdx) => {
                    const el = document.getElementById(`talent-${treeIdx}-${tIdx}`);
                    const pts = buildState[treeIdx][tIdx];
                    el.querySelector('.talent-rank').innerText = `${pts}/${talent.maxRank}`;
                    el.classList.remove('disabled', 'available', 'active', 'maxed');
                    
                    const reqRow = totalTree >= talent.row * 5;
                    let reqDep = true;
                    if(talent.attached !== "none") {
                        const pIdx = tree.talents.findIndex(t => t.name === talent.attached);
                        reqDep = buildState[treeIdx][pIdx] >= tree.talents[pIdx].maxRank;
                    }

                    if(pts === talent.maxRank) el.classList.add('maxed');
                    else if(pts > 0) el.classList.add('active');
                    else if(reqRow && reqDep) el.classList.add('available');
                    else el.classList.add('disabled');
                });
            });

            // "DE LA PUTAMADRE": Sincronización con Wowhead
            if (window.$WowheadPower) window.$WowheadPower.refreshLinks();
        }

        function updateGlobalDisplay() { document.getElementById('points-remaining').innerText = globalPoints; }
        function resetBuild() { loadClass(activeClass.id); }
        function exportBuild() { alert("Build ID: " + Object.values(buildState).map(t => t.join('')).join('-')); }

        window.onload = init;
    </script>
</body>
</html>
