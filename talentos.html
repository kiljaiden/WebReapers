<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talentos WotLK 3.3.5a - Eternal Reapers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========================================================= */
        /* ESTILOS BATTLE.NET + CALCULADORA LIGERA (CDN zamimg)      */
        /* Sin power.js: tooltips propios estilo ?tooltips           */
        /* ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        :root {
            --bnet-bg: #15171e; --bnet-panel: #1e2028; --bnet-sidebar: #101216;
            --bnet-blue: #0074e0; --bnet-blue-hover: #008afb; --bnet-text: #d2d6df;
            --bnet-border: #2a2e38; --bnet-text-muted: #858b99;
            --wow-gold: #f8b700; --danger: #b30000; --success: #00ff00; --epic: #a335ee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--bnet-bg); color: var(--bnet-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }

        /* TOPBAR */
        .bnet-topbar { height: 65px; background: #101216; border-bottom: 1px solid #1a1c23; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; flex-shrink: 0; z-index: 100;}
        .bnet-logo { display: flex; align-items: center; gap: 25px; }
        .top-nav { display: flex; gap: 12px; }
        .top-nav a { color: var(--bnet-text); background-color: var(--bnet-panel); border: 1px solid var(--bnet-border); text-decoration: none; font-size: 0.8rem; font-weight: 700; transition: 0.2s; text-transform: uppercase; padding: 8px 16px; border-radius: 4px; display: flex; align-items: center; gap: 8px; }
        .top-nav a:hover { background-color: rgba(255,255,255,0.05); border-color: var(--wow-gold); color:#fff; transform: translateY(-2px); }
        .top-nav a.active { background-color: var(--wow-gold); color: #000; border-color: var(--wow-gold); }

        .bnet-app-body { display: flex; flex-grow: 1; height: calc(100vh - 145px); }

        /* SIDEBAR DE CLASES */
        .bnet-sidebar { width: 250px; background: var(--bnet-sidebar); border-right: 1px solid #1a1c23; overflow-y: auto; flex-shrink: 0; }
        .sidebar-title { font-size: 0.7rem; color: #555; padding: 15px 25px 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item { padding: 10px 25px; display: flex; align-items: center; gap: 15px; color: #858b99; cursor: pointer; border-left: 3px solid transparent; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: #fff; border-left: 3px solid var(--wow-gold); }
        .class-icon-sidebar { width: 28px; height: 28px; border-radius: 4px; border: 1px solid #333; object-fit: cover; background: #000; }

        /* MAIN CONTENT */
        .bnet-main { flex-grow: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top, #1e222d 0%, #15171e 100%); }
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 4px; border: 1px solid var(--bnet-border); border-left: 4px solid var(--wow-gold); flex-wrap: wrap; gap: 12px; }
        .header-actions { display: flex; gap: 8px; }
        .btn-sm { background: var(--bnet-panel); color: var(--bnet-text); border: 1px solid var(--bnet-border); padding: 7px 14px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: .2s; }
        .btn-sm:hover { border-color: var(--wow-gold); color: #fff; }
        .points-display { font-size: 2rem; font-weight: bold; color: var(--wow-gold); text-align: right; }

        /* ARBOLES DE TALENTOS */
        .trees-container { display: flex; gap: 20px; justify-content: center; min-width: 950px; }
        .tree-panel { flex: 1; max-width: 310px; background: linear-gradient(#0b0c10, #12141a); border: 1px solid #333; border-radius: 4px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tree-header { position: relative; z-index: 1; padding: 12px; text-align: center; background: rgba(0,0,0,0.8); border-bottom: 1px solid #333; display:flex; align-items:center; justify-content:center; gap:10px; }
        .tree-header img { width: 26px; height: 26px; border-radius: 4px; }
        .tree-title { font-size: 1rem; font-weight: bold; color: #fff; text-transform: uppercase; }
        .tree-pts-count { position:absolute; right:12px; top:50%; transform:translateY(-50%); color: var(--wow-gold); font-weight:bold; font-size:.9rem; }

        .tree-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(11, 55px); gap: 10px; padding: 20px; justify-items: center; align-items: center; }

        /* MOTOR DE TALENTOS (ICONOS CDN ZAMIMG — página ligera) */
        .talent-slot { position: relative; width: 44px; height: 44px; cursor: pointer; transition: transform .15s ease; }
        .talent-slot:not(.disabled):hover { transform: scale(1.12); z-index: 3; }
        .talent-slot:not(.disabled):active { transform: scale(.95); }
        .talent-icon {
            width: 100%; height: 100%; border-radius: 4px; border: 2px solid #444;
            object-fit: cover; background: #000; display: block;
            filter: grayscale(100%) brightness(0.4);
        }
        .talent-slot.available .talent-icon { filter: grayscale(0%) brightness(0.7); border-color: #888; }
        .talent-slot.active .talent-icon { filter: grayscale(0%) brightness(1); border-color: var(--success); }
        .talent-slot.maxed .talent-icon { filter: grayscale(0%) brightness(1); border-color: var(--wow-gold); box-shadow: 0 0 10px var(--wow-gold); }
        .talent-slot.disabled { cursor: not-allowed; opacity: 0.5; }
        .talent-rank { position: absolute; bottom: -6px; right: -6px; background: #111; border: 1px solid #444; color: #888; font-size: 0.7rem; font-weight: bold; padding: 1px 4px; border-radius: 3px; z-index: 5; pointer-events: none; }

        /* TOOLTIP PROPIO LIGERO (estilo ?tooltips de UltimoWoW, sin librerías) */
        #er-tip {
            position: fixed; z-index: 9999; display: none; max-width: 340px;
            background: rgba(16,18,25,0.97); border: 1px solid #00aeff; border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,.7); padding: 10px 12px; pointer-events: none;
        }
        #er-tip .tip-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        #er-tip .tip-head img { width: 32px; height: 32px; border-radius: 3px; border: 1px solid #444; }
        #er-tip .tip-name { color: #ffd100; font-weight: 700; font-size: .9rem; line-height: 1.15; }
        #er-tip .tip-rank { color: #aaa; font-size: .72rem; }
        #er-tip .tip-desc { color: #d2d6df; font-size: .78rem; line-height: 1.35; white-space: pre-line; }
        #er-tip .tip-foot { margin-top: 6px; font-size: .68rem; color: #5b9bd5; }

        /* FOOTER */
        .bnet-footer { height: 80px; background: var(--bnet-panel); border-top: 1px solid #1a1c23; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: fixed; bottom: 0; width: 100%; z-index: 100; }
        .btn-play { background: var(--bnet-blue); color: #fff; font-size: 1.4rem; font-weight: 700; padding: 12px 60px; border: none; border-radius: 3px; cursor: pointer; text-transform: uppercase; }
    </style>
    <link rel="stylesheet" href="shared-design.css">
    <!-- ===== PWA: manifest, tema y service worker ===== -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#15171e">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
    window.addEventListener('offline',()=>document.body.classList.add('er-offline'));
    window.addEventListener('online',()=>document.body.classList.remove('er-offline'));</script>
</head>
<body oncontextmenu="return false;">
<div id="er-offline-banner">⚠️ Sin conexión — mostrando datos en caché (modo offline PWA)</div>

    <header class="bnet-topbar">
        <div class="bnet-logo">
            <i class="fab fa-battle-net" style="color:#00aeff; font-size:2rem; text-shadow: 0 0 10px rgba(0,174,255,0.5);"></i>
            <nav class="top-nav" id="er-top-nav"><!-- Enlaces generados por shared-nav.js --></nav>
        </div>
        <div class="user-menu"><span id="user-name" style="font-weight: bold;">Invitado</span></div>
    </header>

    <div class="bnet-app-body">
        <aside class="bnet-sidebar" id="class-sidebar">
            <div class="sidebar-title">Clases (WotLK 3.3.5a)</div>
        </aside>

        <main class="bnet-main">
            <div class="calc-header">
                <div>
                    <h2 id="display-class-name" style="text-transform: uppercase; letter-spacing: 2px;">Calculadora</h2>
                    <p style="color: var(--bnet-text-muted); font-size: 0.8rem;">Iconos vía CDN Wowhead/Zamimg · Datos compactos talentos-v3.json · Tooltip propio sin librerías</p>
                </div>
                <div class="header-actions">
                    <button class="btn-sm" id="btn-reset" title="Reiniciar build"><i class="fas fa-undo"></i> Reiniciar</button>
                    <button class="btn-sm" id="btn-copy" title="Copiar enlace con la build"><i class="fas fa-link"></i> Compartir</button>
                </div>
                <div style="text-align: right;">
                    <p style="font-size: 0.7rem; font-weight: bold; color: #888;">PUNTOS</p>
                    <div class="points-display" id="global-points">71</div>
                </div>
            </div>

            <div class="trees-container" id="trees-wrapper"></div>
        </main>
    </div>

    <footer class="bnet-footer">
        <div style="display:flex; align-items:center; gap:20px;">
            <i class="fas fa-server" style="color:var(--bnet-blue); font-size:2.2rem; text-shadow:0 0 10px rgba(0,116,224,0.5);"></i>
            <div style="display:flex; flex-direction:column;">
                <span style="font-size:0.7rem; color:#858b99; text-transform:uppercase;">Build Actual</span>
                <span id="build-summary" style="font-weight:bold; color:#fff; font-size:1.1rem;">0 / 0 / 0</span>
            </div>
        </div>
        <button class="btn-play">JUGAR</button>
    </footer>

    <!-- Tooltip ligero reutilizable -->
    <div id="er-tip"></div>

    <!-- Diccionario nombre->icono (normalizado) y JSON compacto v3 -->
    <script src="data/talent-icons.js"></script>
    <script>
    /* =====================================================================
       Calculadora de Talentos WotLK 3.3.5a — versión ligera
       - Datos: data/talentos-v3.json (60 KB, formato compacto n/r/c/m/i/at)
       - Iconos: https://wow.zamimg.com/images/wow/icons/medium/{icon}.jpg
         con loading="lazy" (no bloquea el render, 3 árboles visibles = rápido)
       - Fallback de icono roto: inv_misc_questionmark
       - Tooltips propios estilo "?tooltips": se piden a Wowhead/es local y
         se cachean en localStorage (sin jQuery ni power.js)
       ===================================================================== */
    const ICON_CDN = 'https://wow.zamimg.com/images/wow/icons/medium/';
    const FALLBACK_ICON = 'inv_misc_questionmark';
    let talentData = null, globalPoints = 71, activeClass = null, buildState = {};

    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();

    function iconUrl(name){ return ICON_CDN + encodeURIComponent(name) + '.jpg'; }

    // 1. CARGA DEL JSON COMPACTO v3
    async function init() {
        try {
            const r = await fetch('data/talentos-v3.json');
            talentData = await r.json();
            renderSidebar();
            // Soporte de enlace compartido: ?c=warrior&b=0,0,5,...
            loadClassFromURL();
        } catch (err) {
            console.error("No se encontró data/talentos-v3.json", err);
        }
    }

    function loadClassFromURL(){
        const q = new URLSearchParams(location.search);
        const cid = q.get('c');
        const cls = talentData.classes[cid] || Object.values(talentData.classes)[0];
        loadClass(cls.id);
        const b = q.get('b');
        if(b){
            const arr = b.split(',').map(Number);
            let k = 0;
            for(let t=0;t<3;t++) for(let i=0;i<talentData.classes[cls].trees[t].talents.length;i++){
                buildState[t][i] = Math.min(arr[k]||0, activeClass.trees[t].talents[i].m); k++;
            }
            // recalcular puntos gastados
            globalPoints = 71 - Object.values(buildState).flat().reduce((a,b)=>a+b,0);
            refreshUI();
        }
    }

    // 2. SIDEBAR CON CLASES (icono de clase también desde CDN, lazy)
    function renderSidebar() {
        const sidebar = document.getElementById('class-sidebar');
        sidebar.innerHTML = '<div class="sidebar-title">Clases (WotLK 3.3.5a)</div>';
        for(const cid of Object.keys(talentData.classes)){
            const cls = talentData.classes[cid];
            const item = document.createElement('div');
            item.className = `nav-item ${activeClass && activeClass.id === cls.id ? 'active' : ''}`;
            item.innerHTML = `<img class="class-icon-sidebar" loading="lazy" src="${iconUrl(cls.icon)}" onerror="this.src='${iconUrl(FALLBACK_ICON)}'"><span>${cls.name}</span>`;
            item.onclick = () => loadClass(cls.id);
            sidebar.appendChild(item);
        }
    }

    function loadClass(id) {
        activeClass = talentData.classes.find(c => c.id === id);
        document.getElementById('display-class-name').innerText = activeClass.name;
        globalPoints = 71; buildState = {};
        renderSidebar();
        renderTrees();
        history.replaceState(null,'',`?c=${id}`);
    }

    // 3. RENDERIZADO CON ICONOS CDN + LAZY LOADING
    function renderTrees() {
        const wrapper = document.getElementById('trees-wrapper');
        wrapper.innerHTML = '';

        activeClass.trees.forEach((tree, treeIdx) => {
            buildState[treeIdx] = Array(tree.talents.length).fill(0);
            const panel = document.createElement('div');
            panel.className = 'tree-panel';
            panel.innerHTML = `
                <div class="tree-header">
                    <img loading="lazy" src="${iconUrl(tree.icon)}" onerror="this.src='${iconUrl(FALLBACK_ICON)}'" alt="">
                    <div class="tree-title">${tree.name}</div>
                    <div class="tree-pts-count" id="tree-pts-${treeIdx}">0</div>
                </div>
                <div class="tree-grid" id="grid-${treeIdx}"></div>`;

            const grid = panel.querySelector('.tree-grid');
            tree.talents.forEach((talent, tIdx) => {
                const slot = document.createElement('div');
                slot.className = 'talent-slot disabled';
                slot.id = `talent-${treeIdx}-${tIdx}`;
                slot.style.gridRow = talent.r + 1;
                slot.style.gridColumn = talent.c + 1;
                const icon = talent.i || FALLBACK_ICON;
                slot.innerHTML = `
                    <img class="talent-icon" loading="lazy" decoding="async"
                         src="${iconUrl(icon)}"
                         onerror="this.onerror=null;this.src='${iconUrl(FALLBACK_ICON)}'"
                         alt="${talent.n}">
                    <div class="talent-rank">0/${talent.m}</div>`;

                slot.dataset.tree = treeIdx; slot.dataset.idx = tIdx;
                slot.onmousedown = (e) => handleTalentClick(e, treeIdx, tIdx);
                slot.addEventListener('mouseenter', showTip);
                slot.addEventListener('mousemove', moveTip);
                slot.addEventListener('mouseleave', hideTip);
                grid.appendChild(slot);
            });
            wrapper.appendChild(panel);
        });
        refreshUI();
    }

    // 4. REGLAS DE CLICK (izq asigna / der quita), prerequisitos por "at" y fila
    function canAdd(treeIdx, tIdx){
        const talent = activeClass.trees[treeIdx].talents[tIdx];
        const totalInTree = buildState[treeIdx].reduce((a,b)=>a+b,0);
        if(totalInTree < talent.r * 5) return false;
        if(talent.at){
            const need = activeClass.trees[treeIdx].talents.findIndex(t => t.n === talent.at);
            if(need >= 0 && buildState[treeIdx][need] < activeClass.trees[treeIdx].talents[need].m) return false;
        }
        return true;
    }
    function hasDependents(treeIdx, tIdx){
        const tn = activeClass.trees[treeIdx].talents[tIdx].n;
        return activeClass.trees[treeIdx].talents.some((t,i)=> t.at===tn && i!==tIdx && buildState[treeIdx][i]>0);
    }

    function handleTalentClick(e, treeIdx, tIdx) {
        e.preventDefault();
        const talent = activeClass.trees[treeIdx].talents[tIdx];
        const current = buildState[treeIdx][tIdx];
        if(e.button === 0) {
            if(globalPoints <= 0 || current >= talent.m || !canAdd(treeIdx,tIdx)) return;
            buildState[treeIdx][tIdx]++; globalPoints--;
        } else if(e.button === 2) {
            if(current <= 0 || hasDependents(treeIdx,tIdx)) return;
            buildState[treeIdx][tIdx]--; globalPoints++;
        }
        refreshUI();
    }

    // 5. TOOLTIP LIGERO ESTILO "?TOOLTIPS" (fetch a Wowhead ES, cache localStorage)
    const tipEl = document.getElementById('er-tip');
    let tipTimer = null;

    function tipCacheKey(n){ return 'er-tip:' + n; }
    function cachedDesc(n){ try{ return localStorage.getItem(tipCacheKey(n)); }catch(e){ return null; } }
    function storeDesc(n,d){ try{ if(d && d.length<4000) localStorage.setItem(tipCacheKey(n),d); }catch(e){} }

    function showTip(e){
        const slot = e.currentTarget;
        const t = activeClass.trees[slot.dataset.tree].talents[slot.dataset.idx];
        const pts = buildState[slot.dataset.tree][slot.dataset.idx];
        tipEl.innerHTML = `
            <div class="tip-head">
                <img src="${iconUrl(t.i||FALLBACK_ICON)}" alt="">
                <div>
                    <div class="tip-name">${t.n}</div>
                    <div class="tip-rank">Rango ${pts}/${t.m}${t.at?` &nbsp;·&nbsp; Requiere: ${t.at}`:''}</div>
                </div>
            </div>
            <div class="tip-desc">${cachedDesc(t.n) || '<span style="color:#858b99">Cargando descripción…</span>'}</div>
            <div class="tip-foot">Clic izq: añadir · Clic der: quitar · Ver en <b>UltimoWoW</b></div>`;
        tipEl.style.display = 'block';
        moveTip(e);
        if(!cachedDesc(t.n)) fetchDesc(t.n);
    }
    function moveTip(e){
        const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
        let x = e.clientX + pad, y = e.clientY + pad;
        if(x + w > innerWidth - 8)  x = e.clientX - w - pad;
        if(y + h > innerHeight - 8) y = innerHeight - h - 8;
        tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    }
    function hideTip(){ tipEl.style.display = 'none'; }

    async function fetchDesc(name){
        try{
            const url = 'https://es.wowhead.com/wotlk/search?q=' + encodeURIComponent(name) + '&json';
            const r = await fetch(url); const j = await r.json();
            const hit = (j.search || []).find(s => norm(s.name) === norm(name)) || j.search && j.search[0];
            let desc = '';
            if(hit && hit.path){
                const d = await fetch('https://es.wowhead.com/' + hit.path + '?json');
                const dj = await d.json();
                desc = (dj.description || '').replace(/<[^>]+>/g,'').trim();
                if(dj.spells && dj.spells[0]){
                    const rows = dj.spells.map(sp => `Rango ${sp.rank}: ${(sp.description||'').replace(/<br\/?>/g,'\n').replace(/<[^>]+>/g,'')}`);
                    desc += (desc?'\n':'') + rows.join('\n');
                }
            }
            if(desc){
                storeDesc(name, desc);
                // si el tooltip sigue abierto para ese talento, refrescar
                const cur = tipEl.querySelector('.tip-name');
                if(cur && norm(cur.textContent) === norm(name)){
                    tipEl.querySelector('.tip-desc').textContent = desc;
                }
            }
        }catch(err){ /* offline o CORS: mostrar solo info local */ }
    }

    // 6. REFRESH VISUAL + RESUMEN
    function refreshUI() {
        document.getElementById('global-points').innerText = globalPoints;
        activeClass.trees.forEach((_, i) => {
            const total = buildState[i].reduce((a, b) => a + b, 0);
            document.getElementById(`tree-pts-${i}`).innerText = total;
        });
        activeClass.trees.forEach((tree, treeIdx) => {
            const totalTree = buildState[treeIdx].reduce((a, b) => a + b, 0);
            tree.talents.forEach((talent, tIdx) => {
                const el = document.getElementById(`talent-${treeIdx}-${tIdx}`);
                const pts = buildState[treeIdx][tIdx];
                el.querySelector('.talent-rank').innerText = `${pts}/${talent.m}`;
                el.classList.remove('disabled','available','active','maxed');
                if(pts === talent.m) el.classList.add('maxed');
                else if(pts > 0) el.classList.add('active');
                else if(canAdd(treeIdx,tIdx)) el.classList.add('available');
                else el.classList.add('disabled');
            });
        });
        const summary = activeClass.trees.map((_, i) => buildState[i].reduce((a,b)=>a+b,0)).join(' / ');
        document.getElementById('build-summary').innerText = summary;
    }

    // 7. BOTONES REINICIAR / COMPARTIR
    document.getElementById('btn-reset').onclick = () => loadClass(activeClass.id);
    document.getElementById('btn-copy').onclick = async () => {
        const flat = [];
        activeClass.trees.forEach((_,i)=>buildState[i].forEach(v=>flat.push(v)));
        const url = `${location.origin}${location.pathname}?c=${activeClass.id}&b=${flat.join(',')}`;
        try{ await navigator.clipboard.writeText(url); alert('Enlace copiado:\n'+url); }
        catch(e){ prompt('Copia este enlace:', url); }
    };

    window.onload = init;
    </script>
    <!-- ===== Configuracion unica de Firebase y navegacion uniforme ===== -->
    <script src="firebase-config.js"></script>
    <script src="firebase-init.js"></script>
    <script src="shared-nav.js" defer></script>
    <script src="shared-ui.js" defer></script>
</body>
</html>
