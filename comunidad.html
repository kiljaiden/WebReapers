<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop - Eternal Reapers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========================================================= */
        /* VARIABLES Y ESTILO INMERSIVO BATTLE.NET (PROTEGIDO)       */
        /* ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        
        :root { 
            --bnet-bg: #15171e; --bnet-panel: #1e2028; --bnet-sidebar: #101216; 
            --bnet-blue: #0074e0; --bnet-blue-hover: #008afb; --bnet-text: #d2d6df; 
            --bnet-border: #2a2e38; --bnet-text-muted: #858b99;
            --wow-gold: #f8b700; --danger: #ff4d4d; --success: #00b33c; --epic: #a335ee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background: var(--bnet-bg); color: var(--bnet-text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* TOPBAR */
        .bnet-topbar { height: 65px; background: #101216; border-bottom: 1px solid #1a1c23; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; flex-shrink: 0; z-index: 100;}
        .top-nav { display: flex; gap: 12px; }
        .top-nav a { color: var(--bnet-text); background-color: var(--bnet-panel); border: 1px solid var(--bnet-border); text-decoration: none; font-size: 0.8rem; font-weight: 700; transition: 0.2s; text-transform: uppercase; padding: 8px 16px; border-radius: 4px; }
        .top-nav a.active { background-color: var(--wow-gold); color: #000; border-color: var(--wow-gold); }

        .bnet-app-body { display: flex; flex-grow: 1; height: calc(100vh - 145px); overflow: hidden; }
        
        /* SIDEBAR IZQUIERDO */
        .bnet-sidebar { width: 260px; background: var(--bnet-sidebar); border-right: 1px solid #1a1c23; overflow-y: auto; flex-shrink: 0; }
        .sidebar-title { font-size: 0.7rem; color: #555; padding: 15px 25px 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 15px; color: #858b99; cursor: pointer; border-left: 3px solid transparent; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: #fff; border-left: 3px solid var(--bnet-blue); }

        .wallet-sidebar { margin: 15px; padding: 15px; background: #1e2028; border-radius: 8px; border: 1px solid var(--bnet-border); }

        /* CONTENIDO PRINCIPAL */
        .bnet-main { flex-grow: 1; padding: 25px; overflow-y: auto; background: radial-gradient(circle at top, #1e222d 0%, #15171e 100%); }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding-bottom: 50px; }
        .item-card { background: var(--bnet-panel); border: 1px solid var(--bnet-border); border-radius: 6px; cursor: pointer; overflow: hidden; transition: 0.2s; }
        .item-card:hover { border-color: var(--bnet-blue); transform: translateY(-3px); }
        .item-thumb { width: 100%; height: 110px; background-size: cover; background-position: center; border-bottom: 1px solid var(--bnet-border); }

        /* SIDEBAR DERECHO (GUILD) */
        .bnet-right-sidebar { width: 280px; background: var(--bnet-sidebar); border-left: 1px solid #1a1c23; overflow-y: auto; flex-shrink: 0; }
        .member-row { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02); transition: 0.2s; }
        .member-row:hover { background: rgba(255,255,255,0.05); }
        .member-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--bnet-border); object-fit: cover; }

        /* MODAL DE CHAT FLOTANTE (ESTILO SOCIAL) */
        .chat-modal-social { position: fixed; bottom: 95px; right: 300px; width: 340px; height: 420px; background: var(--bnet-panel); border: 1px solid var(--bnet-border); border-radius: 8px; display: none; flex-direction: column; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .chat-header { padding: 12px; background: var(--bnet-sidebar); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bnet-border); }
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.1); }
        .chat-bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.8rem; line-height: 1.3; }
        .chat-bubble.mine { align-self: flex-end; background: var(--bnet-blue); color: #fff; border-bottom-right-radius: 2px; }
        .chat-bubble.theirs { align-self: flex-start; background: #2a2e38; border-bottom-left-radius: 2px; border: 1px solid #333; color: #fff; }

        /* FOOTER FIJO (80PX) */
        .bnet-footer { height: 80px; background: var(--bnet-panel); border-top: 1px solid #1a1c23; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; flex-shrink: 0; position: relative; z-index: 100; width: 100%; }
        .btn-style { background: var(--bnet-blue); color: #fff; font-size: 0.9rem; font-weight: 700; padding: 10px 25px; border: none; border-radius: 3px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .form-control { width: 100%; background: var(--bnet-sidebar); border: 1px solid var(--bnet-border); padding: 10px; color: #fff; border-radius: 4px; outline: none; }
        
        .view-section { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header class="bnet-topbar">
        <div class="bnet-logo">
            <i class="fab fa-battle-net" style="color:#00aeff; font-size:2rem;"></i>
            <nav class="top-nav">
                <a href="index3.html">Inicio</a>
                <a href="softreserve.html">SoftReserve</a>
                <a href="dkp.html">DKP</a>
                <a href="comunidad.html" class="active">Workshop</a>
            </nav>
        </div>
        <div class="user-identity" style="display: flex; align-items: center; gap: 12px;">
            <div style="text-align: right; line-height: 1.1;">
                <span id="topName" style="font-weight: 800; font-size: 0.85rem; color: #fff; text-transform: uppercase;">Invitado</span>
                <span id="topRole" style="font-size: 0.6rem; color: var(--success); font-weight: bold; display: block;">ONLINE</span>
            </div>
            <img src="img/avatars/default.jpg" id="topIcon" style="width: 40px; height: 40px; border-radius: 4px; border: 1px solid var(--bnet-border); object-fit: cover;">
        </div>
    </header>

    <div class="bnet-app-body">
        <aside class="bnet-sidebar">
            <div class="wallet-sidebar">
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px;">
                    <span><i class="fas fa-gem" style="color:var(--epic);"></i> DKP</span><span id="dkpVal" style="color:var(--epic);">0</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold;">
                    <span><i class="fas fa-coins" style="color:var(--wow-gold);"></i> ORO</span><span id="goldVal" style="color:var(--wow-gold);">0</span>
                </div>
            </div>

            <div class="sidebar-title">Explorar</div>
            <div class="nav-item active" onclick="filterMarket('all', this)"><i class="fas fa-globe"></i> Todo</div>
            <div class="nav-item" onclick="filterMarket('Utilitarios Raid', this)"><i class="fas fa-tools"></i> Utilitarios Raid</div>
            <div class="nav-item" onclick="filterMarket('Ventas', this)"><i class="fas fa-shopping-bag"></i> Ventas</div>
            <div class="nav-item" onclick="filterMarket('Servicios', this)"><i class="fas fa-handshake"></i> Servicios</div>
            
            <div class="sidebar-title">Mi Cuenta</div>
            <div class="nav-item" onclick="showUserSection('compras', this)"><i class="fas fa-history"></i> Registro de Compras</div>
            <div class="nav-item" onclick="showUserSection('publicaciones', this)"><i class="fas fa-upload"></i> Mis Publicaciones</div>

            <div id="adminArea" style="display: none;">
                <div class="sidebar-title" style="color: var(--epic);">Administración</div>
                <div class="nav-item" onclick="toggleView('admin', this)"><i class="fas fa-user-shield"></i> Gestión de Saldo</div>
            </div>
        </aside>

        <main class="bnet-main">
            <div id="marketView" class="view-section" style="display: block;">
                <div class="market-grid" id="marketGrid"></div>
            </div>

            <div id="adminView" class="view-section">
                <div style="background: var(--bnet-sidebar); padding: 30px; border-radius: 8px; border: 1px solid var(--epic); max-width: 450px;">
                    <h2 style="color:var(--epic); margin-bottom:15px; font-size: 1.2rem;">Oficialía: Cargar Saldo</h2>
                    <input type="text" id="admUser" class="form-control" placeholder="Nombre del Miembro">
                    <input type="number" id="admQty" class="form-control" style="margin: 12px 0;" placeholder="Monto">
                    <select id="admType" class="form-control" style="margin-bottom: 20px;">
                        <option value="dkp">DKP</option><option value="oro">Oro</option>
                    </select>
                    <button class="btn-style" style="width: 100%;" onclick="execReload()">Actualizar</button>
                    <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
                    <button class="btn-style" style="width: 100%; background: var(--danger);" onclick="wipeStore()">BORRAR TODA LA TIENDA</button>
                </div>
            </div>
        </main>

        <aside class="bnet-right-sidebar">
            <div class="sidebar-title" style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);">Hermandad</div>
            <div id="guildList"></div>
        </aside>
    </div>

    <div class="chat-modal-social" id="chatModal">
        <div class="chat-header">
            <span id="chatPeer" style="font-weight: bold; color: var(--wow-gold); font-size: 0.85rem;">Mensajes</span>
            <i class="fas fa-times" style="cursor: pointer; font-size: 0.9rem;" onclick="document.getElementById('chatModal').style.display='none'"></i>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div style="padding: 10px; background: var(--bnet-sidebar); display: flex; gap: 5px;">
            <input type="text" id="chatInput" class="form-control" style="height: 35px;" placeholder="Escribe..." onkeypress="if(event.key=='Enter') sendChat()">
            <button onclick="sendChat()" style="background: none; border: none; color: var(--bnet-blue); cursor: pointer;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <footer class="bnet-footer">
        <div style="display:flex; align-items:center; gap:20px;">
            <i class="fas fa-university" style="color:var(--wow-gold); font-size:2.5rem;"></i>
            <div><span style="font-size:0.75rem; color:#858b99; text-transform:uppercase; font-weight: bold;">Eternal Reapers Workshop</span><span id="activeStats" style="display:block; font-weight:bold; color:#fff;">0 PRODUCTOS ACTIVOS</span></div>
        </div>
        <button class="btn-style" onclick="document.getElementById('publishModal').style.display='flex'">Publicar Producto</button>
    </footer>

    <div class="modal-overlay" id="detailModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:2500;" onclick="if(event.target==this) this.style.display='none'">
        <div style="background: var(--bnet-panel); width: 100%; max-width: 450px; border-radius: 8px; border: 1px solid var(--bnet-border);">
            <div style="padding: 25px;">
                <div id="detImg" style="height:180px; background-size:cover; background-position:center; border-radius:6px; margin-bottom:15px; border:1px solid #2a2e38;"></div>
                <h2 id="detTitle" style="color:#fff; font-size: 1.2rem; margin-bottom: 5px;"></h2>
                <div style="font-size:0.75rem; color:var(--bnet-blue); font-weight:bold; margin-bottom: 10px;" id="detCat"></div>
                <p id="detDesc" style="color:var(--bnet-text-muted); font-size:0.9rem; line-height: 1.4; margin-bottom: 20px;"></p>
                <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--bnet-border); padding-top:20px;">
                    <div>
                        <span id="detAuthor" style="color:var(--wow-gold); font-size:0.8rem; font-weight:bold; display:block;"></span>
                        <span id="detPrice" style="color: var(--success); font-size: 1.1rem; font-weight: bold;"></span>
                    </div>
                    <button id="detActionBtn" class="btn-style"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="publishModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:3000;" onclick="if(event.target==this) this.style.display='none'">
        <div style="background:var(--bnet-panel); width:450px; padding:30px; border-radius:8px; border:1px solid var(--bnet-border);">
            <h2 style="color:#fff; margin-bottom:20px; text-transform:uppercase; font-size: 1.1rem;">Publicar Producto</h2>
            <form id="pForm">
                <input type="text" id="pTitle" class="form-control" placeholder="Título del Producto o Servicio" required>
                <select id="pCat" class="form-control" style="margin: 10px 0;">
                    <option value="Addons">Addon</option><option value="Scripts LUA">Script LUA</option><option value="Perfiles">Perfil Plater</option><option value="Macros">Macro</option><option value="Ventas">Ventas</option><option value="Servicios">Servicios</option>
                </select>
                <div style="display:flex; gap:10px; margin-bottom: 10px;">
                    <input type="number" id="pPrice" class="form-control" placeholder="Precio (0 = Gratis)">
                    <select id="pPay" class="form-control"><option value="DKP">DKP</option><option value="Oro">Oro</option><option value="Gratis">Gratis</option></select>
                </div>
                <textarea id="pDesc" class="form-control" rows="3" placeholder="Descripción detallada..."></textarea>
                <input type="url" id="pImg" class="form-control" style="margin-top:10px;" placeholder="URL de Imagen">
                <button type="submit" class="btn-style" style="width:100%; margin-top:20px;">PUBLICAR AHORA</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, orderBy, onSnapshot, serverTimestamp, setDoc, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGELmVvBZZywbJOf6kuVKQJjKaRt6Q9ws",
            authDomain: "eternalreapersweb.firebaseapp.com",
            projectId: "eternalreapersweb",
            storageBucket: "eternalreapersweb.firebasestorage.app",
            messagingSenderId: "945508907683",
            appId: "1:945508907683:web:b26cc3660298d4d6ba1d16"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let activeUser = null;
        let allMarket = [];
        let currentChatId = null;
        let chatUnsub = null;

        // INICIALIZACIÓN E IDENTIDAD
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const uDoc = await getDoc(doc(db, "users", user.uid));
                if (uDoc.exists()) {
                    activeUser = uDoc.data();
                    document.getElementById('topName').innerText = activeUser.mainName.toUpperCase();
                    document.getElementById('topIcon').src = activeUser.avatarUrl || 'img/avatars/default.jpg';
                    document.getElementById('topRole').innerText = activeUser.role.toUpperCase();
                    
                    if (activeUser.role === 'GM' || activeUser.role === 'Oficial') {
                        document.getElementById('adminArea').style.display = 'block';
                    }

                    // Sincronización Billetera
                    onSnapshot(doc(db, "users_assets", activeUser.mainName.toLowerCase()), (d) => {
                        if (d.exists()) {
                            document.getElementById('dkpVal').innerText = d.data().dkp || 0;
                            document.getElementById('goldVal').innerText = d.data().oro || 0;
                        }
                    });
                }
            }
            loadMarket();
            loadGuild();
        });

        // CARGAR MIEMBROS HERMANDAD
        async function loadGuild() {
            const list = document.getElementById('guildList');
            onSnapshot(query(collection(db, "users"), orderBy("mainName", "asc")), (snap) => {
                list.innerHTML = '';
                snap.forEach(d => {
                    const u = d.data();
                    const row = document.createElement('div');
                    row.className = 'member-row';
                    row.onclick = () => openSocialChat(u.mainName);
                    row.innerHTML = `<img src="${u.avatarUrl || 'img/avatars/default.jpg'}" class="member-avatar">
                        <div><div style="font-size:0.8rem; font-weight:bold; color:#fff;">${u.mainName}</div>
                        <div style="font-size:0.6rem; color:var(--bnet-blue);">${u.role}</div></div>`;
                    list.appendChild(row);
                });
            });
        }

        // CARGAR EL MERCADO
        async function loadMarket() {
            const snap = await getDocs(collection(db, "market"));
            allMarket = [];
            snap.forEach(d => allMarket.push({id: d.id, ...d.data()}));
            renderItems(allMarket);
            document.getElementById('activeStats').innerText = `${allMarket.length} PRODUCTOS ACTIVOS`;
        }

        function renderItems(data) {
            const grid = document.getElementById('marketGrid'); grid.innerHTML = '';
            data.forEach(i => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.onclick = () => showItem(i);
                card.innerHTML = `<div class="item-thumb" style="background-image:url('${i.img}')"></div>
                    <div style="padding:12px;"><div style="font-size:0.65rem; color:var(--bnet-blue); font-weight:bold; text-transform:uppercase;">${i.category}</div>
                    <div style="font-weight:bold; color:#fff; font-size:0.9rem; margin-top:5px; height:20px; overflow:hidden;">${i.title}</div>
                    <div style="color:var(--wow-gold); font-size:1rem; font-weight:bold; margin-top:10px;">${i.price} ${i.payMethod}</div></div>`;
                grid.appendChild(card);
            });
        }

        // MOSTRAR MODAL DETALLES DEL ITEM
        window.showItem = (item) => {
            document.getElementById('detTitle').innerText = item.title;
            document.getElementById('detCat').innerText = item.category.toUpperCase();
            document.getElementById('detDesc').innerText = item.desc;
            document.getElementById('detAuthor').innerText = "Vendedor: " + item.author;
            document.getElementById('detImg').style.backgroundImage = `url('${item.img}')`;
            
            const isGratis = (item.payMethod === 'Gratis' || parseInt(item.price) === 0);
            document.getElementById('detPrice').innerText = isGratis ? 'GRATIS' : `${item.price} ${item.payMethod}`;
            
            const btn = document.getElementById('detActionBtn');
            if (isGratis) {
                btn.innerText = 'CONSULTAR';
                btn.onclick = () => openSocialChat(item.author, `Hola, me interesa tu producto gratuito: ${item.title}`);
            } else {
                btn.innerText = 'COMPRAR';
                btn.onclick = () => processBuy(item);
            }
            
            document.getElementById('detailModal').style.display = 'flex';
        };

        // SISTEMA DE COMPRAS TRANSACCIONAL REPARADO
        async function processBuy(item) {
            if(!activeUser) return alert("Debes iniciar sesión para comprar.");
            if(item.author.toLowerCase() === activeUser.mainName.toLowerCase()) return alert("No puedes comprar tu propio producto.");
            
            const cost = parseInt(item.price); 
            const method = item.payMethod.toLowerCase();
            const bal = parseInt(document.getElementById(method === 'dkp' ? 'dkpVal' : 'goldVal').innerText);
            
            if(bal < cost) return alert("No tienes saldo suficiente.");
            
            if(confirm(`¿Confirmas la compra por ${cost} ${item.payMethod}?`)) {
                try {
                    await runTransaction(db, async (t) => {
                        const bR = doc(db, "users_assets", activeUser.mainName.toLowerCase());
                        const sR = doc(db, "users_assets", item.author.toLowerCase());
                        
                        const bS = await t.get(bR); 
                        const sS = await t.get(sR);
                        
                        // Si no existen las billeteras, asumimos que inician en 0
                        const bData = bS.exists() ? bS.data() : { dkp: 0, oro: 0 };
                        const sData = sS.exists() ? sS.data() : { dkp: 0, oro: 0 };
                        
                        const upB = {}; upB[method] = (bData[method] || 0) - cost;
                        const upS = {}; upS[method] = (sData[method] || 0) + cost;
                        
                        // Cirugía: usar set con merge garantiza que se cree el documento si el vendedor no lo tenía
                        t.set(bR, upB, { merge: true }); 
                        t.set(sR, upS, { merge: true });
                    });

                    // GUARDAR RECIBO PARA "REGISTRO DE COMPRAS"
                    await addDoc(collection(db, "purchases"), {
                        buyer: activeUser.mainName,
                        seller: item.author,
                        prodId: item.id,
                        prodTitle: item.title,
                        price: item.price,
                        payMethod: item.payMethod,
                        timestamp: serverTimestamp()
                    });

                    alert("Compra realizada con éxito.");
                    document.getElementById('detailModal').style.display='none';
                    loadMarket();
                } catch(e) {
                    alert("Error en la transacción base.");
                    console.error(e);
                }
            }
        }

        // CHAT INTERACTIVO SIN REQUISITO DE INDICE
        window.openSocialChat = async (peer, initialMsg = null) => {
            if(!activeUser) return alert("Inicia sesión para usar el chat.");
            if(activeUser.mainName.toLowerCase() === peer.toLowerCase()) return alert("No puedes chatear contigo mismo.");

            const cid = [activeUser.mainName.toLowerCase(), peer.toLowerCase()].sort().join("_");
            currentChatId = cid;
            
            document.getElementById('detailModal').style.display = 'none';
            document.getElementById('chatPeer').innerText = "Chat con " + peer;
            document.getElementById('chatModal').style.display = 'flex';
            
            if(chatUnsub) chatUnsub();
            
            // CIRUGÍA: Ordenamiento en JS para evitar bloqueo de Firebase por falta de índices
            chatUnsub = onSnapshot(query(collection(db, "messages"), where("chatId", "==", cid)), (s) => {
                const box = document.getElementById('chatMessages'); box.innerHTML = '';
                const msgs = [];
                s.forEach(d => msgs.push(d.data()));
                
                // Ordenar por tiempo (local y servidor)
                msgs.sort((a, b) => {
                    const ta = a.time ? a.time.toMillis() : Date.now();
                    const tb = b.time ? b.time.toMillis() : Date.now();
                    return ta - tb;
                });

                msgs.forEach(m => {
                    const b = document.createElement('div');
                    b.className = `chat-bubble ${m.from.toLowerCase() === activeUser.mainName.toLowerCase() ? 'mine' : 'theirs'}`;
                    b.innerText = m.txt; box.appendChild(b);
                });
                box.scrollTop = box.scrollHeight;
            });

            if (initialMsg) {
                document.getElementById('chatInput').value = initialMsg;
                sendChat();
            }
        };

        window.sendChat = async () => {
            const inp = document.getElementById('chatInput');
            if(!inp.value.trim() || !currentChatId) return;
            const t = inp.value; inp.value = '';
            
            await addDoc(collection(db, "messages"), { 
                chatId: currentChatId, 
                from: activeUser.mainName, 
                txt: t, 
                time: serverTimestamp() 
            });
        };

        // NAVEGACIÓN Y FILTROS
        window.filterMarket = (cat, el) => {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            toggleView('market');
            
            if(cat === 'all') renderItems(allMarket);
            else if(cat === 'Utilitarios Raid') {
                const technics = ['Addons', 'Scripts LUA', 'Perfiles', 'Macros'];
                renderItems(allMarket.filter(i => technics.includes(i.category)));
            } else renderItems(allMarket.filter(i => i.category === cat));
        };

        window.showUserSection = async (type, el) => {
            if(!activeUser) return alert("Inicia sesión primero.");
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            toggleView('market');
            
            if (type === 'publicaciones') {
                renderItems(allMarket.filter(i => i.author.toLowerCase() === activeUser.mainName.toLowerCase()));
            } else if (type === 'compras') {
                const q = query(collection(db, "purchases"), where("buyer", "==", activeUser.mainName));
                const s = await getDocs(q);
                const ids = []; s.forEach(d => ids.push(d.data().prodId));
                renderItems(allMarket.filter(i => ids.includes(i.id)));
            }
        };

        window.toggleView = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
            document.getElementById(v + 'View').style.display = 'block';
        };

        // FORMULARIO DE PUBLICACIÓN PROTEGIDO
        document.getElementById('pForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!activeUser) return alert("Debes iniciar sesión para publicar.");

            await addDoc(collection(db, "market"), {
                title: document.getElementById('pTitle').value, 
                category: document.getElementById('pCat').value,
                price: document.getElementById('pPrice').value || "0", 
                payMethod: document.getElementById('pPay').value,
                desc: document.getElementById('pDesc').value, 
                img: document.getElementById('pImg').value || "https://via.placeholder.com/200x150",
                author: activeUser.mainName, 
                createdAt: serverTimestamp()
            });
            alert("Producto publicado exitosamente.");
            location.reload();
        };

        // FUNCIONES DE OFICIAL (ADMIN)
        window.execReload = async () => {
            const t = document.getElementById('admUser').value.trim().toLowerCase();
            const q = parseInt(document.getElementById('admQty').value);
            const ty = document.getElementById('admType').value;
            const ref = doc(db, "users_assets", t);
            const s = await getDoc(ref);
            if(s.exists()){
                const up = {}; up[ty] = (s.data()[ty] || 0) + q;
                await updateDoc(ref, up); alert("Saldo de " + t + " actualizado correctamente.");
            } else {
                // Cirugía: si no existe en assets, lo creamos para evitar errores futuros
                const newData = { dkp: 0, oro: 0, name: t };
                newData[ty] = q;
                await setDoc(ref, newData);
                alert("Billetera creada y saldo actualizado.");
            }
        };

        window.wipeStore = async () => {
            if(!activeUser || (activeUser.role !== 'GM' && activeUser.role !== 'Oficial')) return;
            if(confirm("⚠ PELIGRO: ¿Estás 100% seguro de borrar TODOS los productos de la tienda?")) {
                const snap = await getDocs(collection(db, "market"));
                const p = snap.docs.map(d => deleteDoc(doc(db, "market", d.id)));
                await Promise.all(p); 
                alert("Tienda vaciada por completo."); 
                location.reload();
            }
        };
    </script>
</body>
</html>
</html>
